<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Serif;font-style:normal;src:url(fonts/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:Serif;font-style:italic;src:url(fonts/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(fonts/inter-latin-900-normal.woff2)}

:root{--ink:#0D1712;--green:#1F3A2F;--green2:#2B5040;--moss:#6F9C84;--cream:#F4EFE3;--lime:#D8FF3E;--coral:#FF5B3A;--pink:#FF9BD2;--sky:#9FD3FF;--gold:#FFC83D}
html,body{margin:0;padding:0;background:transparent;width:1080px;height:1920px;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute}

.card{position:absolute;background:var(--cream);border-radius:34px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.toonCard{position:absolute;background:#fff;border:6px solid var(--ink);border-radius:32px;box-shadow:12px 12px 0 var(--ink)}
.row{display:flex;align-items:center}
.cw{display:inline-block;transform-origin:50% 70%;white-space:nowrap}
</style></head>
<body><div id="stage"></div>
<script src="timeline.js"></script>
<!-- overlay.html: every scene of the reel. renderAt(t) draws one frame; ?layer=back|front; ?t=12.3 to preview a moment in a browser. -->
<script>
const Q = new URLSearchParams(location.search);
const LAYER = Q.get('layer') || 'front';
const T = window.TL, WD = window.WORDS, PH = window.PHR;
const S = T.S, W0 = T.win0, SPLIT = T.splitY, FPS = T.fps;
const stage = document.getElementById('stage');
const B = T.brand || {};
const NAME = B.name || 'Michel', INITIAL = (B.initial || NAME[0] || 'M').toUpperCase();
const KEY = (B.keyword || 'EDIT').toUpperCase(), DMLINE = B.dmLine || "Here's the code that edited this video", FILE = B.file || 'edit_this_video.zip';
const WALL = (T.wallImages || []).map(f => 'img/wall/' + f);
const wallImg = k => WALL.length ? WALL[((k % WALL.length) + WALL.length) % WALL.length] : '';
const C = {ink:'#0D1712', green:'#1F3A2F', green2:'#2B5040', moss:'#6F9C84', cream:'#F4EFE3', lime:'#D8FF3E', coral:'#FF5B3A', pink:'#FF9BD2', sky:'#9FD3FF', gold:'#FFC83D'};

// ---------------------------------------------------------------- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const ei = x => Math.pow(clamp(x), 3);
const eio = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eob = (x, s = 1.70158) => { x = clamp(x); const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const bounce = x => { x = clamp(x); const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };
// damped spring 0 -> 1 (t in seconds since start)
const spring = (dt, f = 2.4, d = 7.5) => dt <= 0 ? 0 : 1 - Math.exp(-d * dt) * Math.cos(2 * Math.PI * f * dt);
const lerp = (a, b, p) => a + (b - a) * p;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; (parent || stage).appendChild(e); return e; }
function css(e, o) { for (const k in o) e.style[k] = o[k]; return e; }
function box(parent, x, y, w, h, extra) { const e = el('div', 'abs', parent); css(e, {left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px'}); if (extra) css(e, extra); return e; }
const SVGNS = 'http://www.w3.org/2000/svg';
function svg(parent, w, h, extra) { const s = document.createElementNS(SVGNS, 'svg'); s.setAttribute('width', w); s.setAttribute('height', h); s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.style.position = 'absolute'; s.style.overflow = 'visible'; if (extra) css(s, extra); parent.appendChild(s); return s; }
function sv(parent, tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function jit(pts, seed, amt) { const r = rng(seed); return pts.map(([x, y]) => [x + (r() - .5) * 2 * amt, y + (r() - .5) * 2 * amt]); }
function polyPath(pts, close = true) { return 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + (close ? ' Z' : ''); }
function smoothPath(pts, close = true) {
  const n = pts.length; if (n < 3) return polyPath(pts, close);
  const g = i => close ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  let d = `M${g(0)[0].toFixed(1)} ${g(0)[1].toFixed(1)}`;
  const m = close ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d + (close ? ' Z' : '');
}
const boilSeed = (id, t) => id * 977 + Math.floor(t * 10);
// word timing helpers
const wordAt = (txt, after = 0) => WD.find(w => w.s >= after - 1e-6 && w.w.toLowerCase().replace(/[.,?!]/g, '') === txt.toLowerCase());
const nEvents = t => { let n = 0; for (const e of T.events) if (e <= t + 1e-6) n++; else break; return n; };
const lastEvent = t => { let le = -9; for (const e of T.events) if (e <= t + 1e-6) le = e; else break; return le; };
const pad3 = n => String(n).padStart(3, '0');

// shapes (local coords)
function star5(R, k = .46) { const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * k : R; p.push([r * Math.cos(a), r * Math.sin(a)]); } return p; }
function sparkle(R) { const p = []; for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + i * Math.PI / 4, r = i % 2 ? R * .26 : R; p.push([r * Math.cos(a), r * Math.sin(a)]); } return p; }
function cloud(R) { const p = []; for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2, r = R * (1 + .17 * Math.abs(Math.sin(3.5 * a))); p.push([1.45 * r * Math.cos(a), .85 * r * Math.sin(a)]); } return p; }
function spiral() { const p = []; for (let i = 0; i <= 60; i++) { const a = i / 60 * Math.PI * 5, r = 6 + 13 * a; p.push([r * Math.cos(a), r * Math.sin(a)]); } return p; }
function squiggle(len = 300, amp = 24) { const p = []; for (let x = -len / 2; x <= len / 2; x += 12) p.push([x, amp * Math.sin(x / 19)]); return p; }
const BOLT = [[-40, -130], [38, -130], [6, -34], [66, -34], [-46, 140], [-16, 8], [-72, 8]];
function burst(R1, R2, n, seed) { const r = rng(seed), p = []; for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * Math.PI * 2, rr = i % 2 ? R2 * (.85 + .3 * r()) : R1 * (.9 + .2 * r()); p.push([rr * Math.cos(a) * 1.25, rr * Math.sin(a)]); } return p; }

const SCN = [];
function scene(range, root, render) { SCN.push({range, root, render}); return root; }

// ================================================================ BACK LAYER
function buildBack() {
  // ---------- prompt canvas
  {
    const r = el('div', 'full'); r.style.background = 'radial-gradient(120% 70% at 50% 35%, #172a21 0%, #0B1410 70%)';
    const dots = el('div', 'full', r); css(dots, {backgroundImage: 'radial-gradient(circle, rgba(244,239,227,.07) 2px, transparent 2.6px)', backgroundSize: '36px 36px'});
    const bar = box(r, 60, 150, 960, 60, {display: 'flex', alignItems: 'center', gap: '14px', font: '600 27px Inter', color: 'rgba(244,239,227,.8)'});
    bar.innerHTML = `<span class=dot style="background:#FF5B3A"></span><span class=dot style="background:#FFC83D"></span><span class=dot style="background:#D8FF3E"></span><span style="margin-left:14px">edit_this_video.mov</span><span style="margin-left:auto;display:flex;align-items:center;gap:12px;color:#D8FF3E;font:800 22px Inter;letter-spacing:.14em"><span id=liveDot class=dot style="background:#D8FF3E;box-shadow:0 0 14px #D8FF3E"></span>CLAUDE IS EDITING</span>`;
    box(r, W0.x, W0.y, W0.w, W0.h, {borderRadius: W0.r + 'px', boxShadow: '0 40px 100px rgba(0,0,0,.6)', background: '#000'});
    scene([0, 2.27], r, t => { document.getElementById('liveDot').style.opacity = (Math.floor(t * 3) % 2) ? .35 : 1; });
  }
  // ---------- content wall
  {
    const r = el('div', 'full'); r.style.background = 'radial-gradient(90% 60% at 55% 55%, #1d3a2d 0%, #0b1510 75%)';
    const inner = box(r, -460, -520, 2000, 2960, {transformOrigin: '1000px 1480px'});
    const cols = [];
    for (let c = 0; c < 6; c++) {
      const col = box(inner, 235 + c * 260, 0, 230, 5300);
      for (let k = 0; k < 12; k++) {
        const src = wallImg(c * 5 + k * 7);
        const im = el(src ? 'img' : 'div', 'abs', col); if (src) im.src = src; else im.style.background = [C.green2, C.moss, '#3A5F4E', '#24463A'][(c + k) % 4];
        css(im, {left: '0px', top: k * 439 + 'px', width: '230px', height: '409px', borderRadius: '22px', border: '3px solid rgba(244,239,227,.25)', boxShadow: '0 18px 40px rgba(0,0,0,.45)', objectFit: 'cover'});
      }
      cols.push(col);
    }
    const halo = el('div', 'full', r); halo.style.background = 'radial-gradient(circle at 620px 1100px, rgba(8,16,12,.9) 0, rgba(8,16,12,.6) 360px, rgba(8,16,12,0) 780px)';
    const grad = el('div', 'full', r); grad.style.background = 'linear-gradient(180deg, rgba(8,16,12,.55) 0%, rgba(8,16,12,0) 22%, rgba(8,16,12,0) 64%, rgba(8,16,12,.8) 100%)';
    scene([2.2, 6.875], r, t => {
      const t0 = T.wall.in, p = eo(P(t, t0, t0 + 0.5));
      inner.style.transform = `perspective(1700px) rotateX(24deg) rotateZ(-14deg) scale(${1.7 - .55 * p})`;
      r.style.opacity = P(t, t0 - .04, t0 + .04);
      const L = 439 * 4;
      cols.forEach((col, c) => { const dir = c % 2 ? 1 : -1, sp = 85 + c * 11; const off = (((c * 151 + dir * sp * (t - t0)) % L) + L) % L; col.style.transform = `translateY(${off - L}px)`; });
      const vp = P(t, T.wall.videos - .02, T.wall.videos + .4);
      inner.style.filter = `brightness(${1 + .5 * Math.sin(Math.PI * vp)})`;
    });
  }
  // ---------- cartoon world
  {
    const r = el('div', 'full'); r.style.background = C.cream;
    const ht = el('div', 'full', r); css(ht, {backgroundImage: 'radial-gradient(circle, rgba(13,23,18,.09) 3px, transparent 3.6px)', backgroundSize: '26px 26px'});
    const g = svg(r, 1080, 1920, {left: '0px', top: '0px'});
    const SH = [
      {id: 1, pts: star5(118), x: 180, y: 420, fill: C.lime, close: true, rot: 8, spin: 18, smooth: false},
      {id: 2, pts: BOLT.map(([x, y]) => [x * 1.25, y * 1.25]), x: 905, y: 400, fill: C.gold, close: true, rot: 14, spin: 0, smooth: false},
      {id: 3, pts: sparkle(38), x: 545, y: 255, fill: C.ink, close: true, rot: 0, spin: 40, smooth: false},
      {id: 4, pts: sparkle(28), x: 330, y: 585, fill: C.pink, close: true, rot: 10, spin: -30, smooth: false},
      {id: 5, pts: sparkle(32), x: 760, y: 590, fill: C.sky, close: true, rot: 0, spin: 35, smooth: false},
      {id: 6, pts: cloud(70), x: 150, y: 1040, fill: C.sky, close: true, rot: 0, spin: 0, smooth: true},
      {id: 7, pts: spiral(), x: 955, y: 1010, fill: 'none', stroke: C.pink, close: false, rot: 0, spin: 60, smooth: true, sw: 11},
      {id: 8, pts: squiggle(260, 22), x: 150, y: 1350, fill: 'none', stroke: C.coral, close: false, rot: -24, spin: 0, smooth: true, sw: 12},
      {id: 9, pts: star5(46, .5), x: 960, y: 1330, fill: C.coral, close: true, rot: -10, spin: -25, smooth: false},
      {id: 10, pts: sparkle(24), x: 70, y: 760, fill: C.lime, close: true, rot: 0, spin: 50, smooth: false},
      {id: 11, pts: sparkle(26), x: 1010, y: 640, fill: C.ink, close: true, rot: 0, spin: -45, smooth: false},
    ];
    SH.forEach((s, k) => {
      s.g = sv(g, 'g', {});
      if (s.fill !== 'none') s.sh = sv(s.g, 'path', {fill: C.ink, transform: 'translate(9,9)'});
      s.p = sv(s.g, 'path', {fill: s.fill, stroke: s.stroke || C.ink, 'stroke-width': s.sw || 7, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'});
      s.t0 = T.toon.in + .03 + k * .055;
    });
    // ANIMATIONS
    const word = box(r, 0, 694, 1080, 260, {display: 'flex', justifyContent: 'center', alignItems: 'flex-end'});
    const COLS = [C.lime, C.coral, C.sky, C.gold, C.pink];
    const letters = 'ANIMATIONS'.split('').map((ch, k) => {
      const s = el('span', 'anton stroke', word, ch);
      css(s, {display: 'inline-block', fontSize: '204px', color: COLS[k % 5], WebkitTextStroke: '9px ' + C.ink, textShadow: `10px 10px 0 ${C.ink}`, transformOrigin: '50% 100%', margin: '0 1px'});
      return s;
    });
    scene([S.toon[0], S.toon[1] + .04], r, t => {
      SH.forEach(s => {
        const dt = t - s.t0, sc = dt <= 0 ? 0 : spring(dt, 2.2, 8);
        let pts = jit(s.pts, boilSeed(s.id, t), 2.6);
        const d = s.smooth ? smoothPath(pts, s.close) : polyPath(pts, s.close);
        s.p.setAttribute('d', d); if (s.sh) s.sh.setAttribute('d', d);
        const rot = s.rot + s.spin * (t - T.toon.in);
        s.g.setAttribute('transform', `translate(${s.x},${s.y}) rotate(${rot}) scale(${sc})`);
      });
      const ta = T.toon.create + .02;
      letters.forEach((s, k) => {
        const t0 = ta + k * .05, dt = t - t0;
        if (dt < 0) { s.style.opacity = 0; return; }
        s.style.opacity = 1;
        const fall = bounce(P(t, t0, t0 + .42));
        const y = -760 * (1 - fall);
        const land = t - (t0 + .16);
        const sq = land > 0 ? Math.exp(-9 * land) * Math.sin(2 * Math.PI * 3 * land) : 0;
        const bob = 9 * Math.sin(2 * Math.PI * (1.3 * t - k * .11)) * P(t, t0 + .45, t0 + .8);
        const rot = 4 * Math.sin(2 * Math.PI * (.9 * t - k * .15)) * P(t, t0 + .45, t0 + .8);
        s.style.transform = `translateY(${y + bob}px) rotate(${rot}deg) scale(${1 + .18 * sq}, ${1 - .2 * sq})`;
      });
    });
  }
  // ---------- EDIT marquee (comments beat)
  {
    const r = el('div', 'full'); r.style.background = 'radial-gradient(100% 70% at 55% 50%, #2B5040 0, #1F3A2F 45%, #10221A 100%)';
    const rows = [];
    for (let k = 0; k < 8; k++) {
      const row = box(r, 0, -70 + k * 238, 4000, 240, {whiteSpace: 'nowrap', fontFamily: 'Anton', fontSize: '210px', lineHeight: '240px', letterSpacing: '.02em'});
      row.textContent = `${KEY}  •  `.repeat(8);
      rows.push(row);
    }
    const halo = el('div', 'full', r); halo.style.background = 'radial-gradient(circle at 620px 1120px, rgba(10,20,15,.85) 0, rgba(10,20,15,.5) 360px, rgba(10,20,15,0) 760px)';
    scene([S.cmts[0] - .1, S.cmts[1] + .02], r, t => {
      const te = T.cmts.edit;
      rows.forEach((row, k) => {
        const dir = k % 2 ? 1 : -1;
        const x = -600 + dir * 380 * (t - S.cmts[0]) - (k % 3) * 170;
        row.style.transform = `translateX(${x}px)`;
        const flash = t >= te && t < te + .1;
        const solid = (k === 2 && t >= te) || flash;
        row.style.color = solid ? C.lime : 'transparent';
        row.style.webkitTextStroke = solid ? '0px' : `3px rgba(216,255,62,${k === 2 ? .7 : .38})`;
      });
    });
  }
  // ---------- code panel (split screen top)
  {
    const r = el('div', 'full'); r.style.background = '#0A130F';
    const tabs = box(r, 0, 236, 1080, 70, {display: 'flex', alignItems: 'flex-end', gap: '6px', padding: '0 40px', boxSizing: 'border-box', borderBottom: '2px solid rgba(244,239,227,.08)'});
    tabs.innerHTML = `<div id=tab1 style="font:700 25px Mono;color:#F4EFE3;background:#13211A;padding:16px 26px;border-radius:14px 14px 0 0;border-top:3px solid #D8FF3E">edit_this_video.py</div>
      <div style="font:400 25px Mono;color:rgba(244,239,227,.45);padding:16px 22px">captions.html</div><div style="font:400 25px Mono;color:rgba(244,239,227,.45);padding:16px 22px">beat.py</div>`;
    const body = box(r, 0, 318, 1080, 540, {font: '400 29px Mono', lineHeight: '43px', color: C.cream});
    const CODE = [
      [['c', '# edit_this_video.py — the whole edit, in code']],
      [['f', 'cut'], ['d', '   = '], ['f', 'remove_pauses'], ['d', '('], ['s', '"take.mov"'], ['d', ')']],
      [['f', 'words'], ['d', ' = '], ['f', 'whisper'], ['d', '(cut)       '], ['c', '# word timing']],
      [['f', 'me'], ['d', '    = '], ['f', 'cutout'], ['d', '(cut)        '], ['c', '# AI person mask']],
      [['k', 'for'], ['d', ' t '], ['k', 'in'], ['d', ' '], ['f', 'timeline'], ['d', '('], ['n', '30'], ['d', '):']],
      [['d', '    bg  = '], ['f', 'world'], ['d', '(t)          '], ['c', '# new scene']],
      [['d', '    fx  = '], ['f', 'zoom'], ['d', '(t) + '], ['f', 'shake'], ['d', '(t)']],
      [['d', '    out = bg + me + '], ['f', 'captions'], ['d', '(t) + fx']],
      [['f', 'mix'], ['d', '(voice, '], ['f', 'beat'], ['d', '(), sfx, lufs='], ['n', '-14'], ['d', ')']],
    ];
    const COL = {c: '#6F9C84', f: '#9FD3FF', d: '#F4EFE3', s: '#FF8A6B', k: '#D8FF3E', n: '#FFC83D'};
    const lines = CODE.map((ln, i) => {
      const L = box(body, 0, i * 54, 1080, 54, {display: 'flex', alignItems: 'center', whiteSpace: 'pre'});
      const num = el('span', '', L, String(i + 1)); css(num, {width: '86px', textAlign: 'right', paddingRight: '26px', color: 'rgba(111,156,132,.55)', display: 'inline-block'});
      const txt = el('span', '', L); const segs = ln.map(([k, s]) => { const sp = el('span', '', txt); sp.style.color = COL[k]; return [sp, s]; });
      const caret = el('span', '', L); css(caret, {display: 'inline-block', width: '16px', height: '34px', background: C.lime, marginLeft: '2px'});
      return {L, segs, caret, n: ln.reduce((a, [, s]) => a + s.length, 0)};
    });
    const total = lines.reduce((a, l) => a + l.n, 0);
    const status = box(r, 40, 862, 1000, 62, {display: 'flex', alignItems: 'center', gap: '18px', font: '700 23px Mono', color: C.cream});
    status.innerHTML = `<span style="color:#0D1712;background:#D8FF3E;padding:8px 16px;border-radius:10px">▶ RUNNING</span><span style="color:rgba(244,239,227,.6)">edit_this_video.py</span><span id=fr style="margin-left:auto">frame 0000 / 0844</span>`;
    const prog = box(r, 40, 926, 1000, 6, {background: 'rgba(244,239,227,.1)', borderRadius: '3px'});
    const progIn = box(prog, 0, 0, 0, 6, {background: C.lime, borderRadius: '3px'});
    scene([S.code[0] - .02, S.code[1] + .26], r, t => {
      const t0 = S.code[0], t1 = 13.92;
      let nc = Math.floor(total * P(t, t0 + .02, t1));

    dm.innerHTML = `<div style="position:absolute;left:34px;top:28px;display:flex;align-items:center;gap:16px"><div style="width:58px;height:58px;border-radius:50%;background:#D8FF3E;display:flex;align-items:center;justify-content:center;font:900 26px Inter;color:#0D1712">${INITIAL}</div><div><div style="font:800 28px Inter;color:#0D1712">${NAME}</div><div style="font:600 21px Inter;color:#6F9C84">sent you a message · now</div></div></div>
      <div style="position:absolute;left:34px;top:114px;right:34px;background:#1F3A2F;color:#F4EFE3;border-radius:28px;padding:22px 28px;font:700 34px Inter;line-height:1.2">${DMLINE}</div>
      <div style="position:absolute;left:34px;top:216px;display:flex;align-items:center;gap:14px;background:#0D1712;color:#F4EFE3;border-radius:18px;padding:12px 20px;font:700 25px Mono"><span style="color:#D8FF3E">▣</span>${FILE}</div>`;
    scene([S.cta[0] - .02, T.tEnd + .05], r, t => {
      const dt = t - S.cta[0];
      const bp = spring(dt - .05, 2.3, 8.5);
      const tA = T.cta.typeA, tB = T.cta.typeB, tP = T.cta.post, tD = T.cta.dm;
      const out = ei(P(t, tP + .05, tP + .2));
      bar.style.opacity = dt > .05 ? 1 - out : 0;
      bar.style.transform = `translateY(${(1 - bp) * -60 - out * 160}px) scale(${(.9 + .1 * bp) * (t >= tP && t < tP + .06 ? .96 : 1)})`;
      const txt = document.getElementById('cbTxt'), post = document.getElementById('cbPost');
      if (t < tA) { txt.textContent = 'Add a comment…'; txt.style.cssText = 'font:500 36px Inter;color:#8a8f8b'; }
      else { const n = Math.ceil(KEY.length * P(t, tA, tB)); txt.textContent = KEY.slice(0, Math.max(1, n)) + (t < tB + .1 ? '|' : ''); txt.style.cssText = 'font:900 44px Inter;color:#0D1712;letter-spacing:.04em'; }
      const live = t >= tB; post.style.background = live ? C.lime : 'transparent'; post.style.color = live ? C.ink : '#B9BDB8';
      const dp = spring(t - tD, 2.3, 8.5);
      dm.style.opacity = t >= tD ? 1 : 0;
      dm.style.transform = `translateY(${(1 - dp) * 80}px) scale(${.8 + .2 * dp})`;
    });
  }
  // ---------- HUD edit counter
  {
    const r = el('div', 'full');
    const hud = box(r, 56, 172, 330, 58, {background: 'rgba(13,23,18,.74)', border: '2px solid rgba(216,255,62,.4)', borderRadius: '40px', display: 'flex', alignItems: 'center', gap: '14px', padding: '0 22px', boxSizing: 'border-box', transformOrigin: '0 50%'});
    hud.innerHTML = `<svg width=26 height=26 viewBox="-13 -13 26 26"><path d="${polyPath(sparkle(12))}" fill="#D8FF3E"/></svg><span style="font:800 21px Inter;letter-spacing:.16em;color:#D8FF3E">AI EDITS</span><span id=hudN style="font:700 30px Mono;color:#F4EFE3;display:inline-block">000</span>`;
    scene([S.wall[0], T.tEnd + .25], r, t => {
      const n = nEvents(t); const nn = document.getElementById('hudN'); nn.textContent = pad3(n);
      const le = lastEvent(t); nn.style.transform = `scale(${t - le < .07 ? 1.18 : 1})`; nn.style.color = t - le < .07 ? C.lime : C.cream;
      hud.style.opacity = P(t, S.wall[0], S.wall[0] + .1) * (1 - P(t, T.tEnd, T.tEnd + .15));
      // during the letterbox tension the HUD sits in the bar
      hud.style.transform = `scale(${t >= S.tense[0] && t < S.tense[1] ? .9 : 1})`;
    });
  }
  // ---------- captions
  {
    const r = el('div', 'full');
    const capBox = box(r, 70, 0, 940, 300, {display: 'flex', justifyContent: 'center', alignItems: 'center'});
    const capIn = el('div', '', capBox);
    css(capIn, {display: 'flex', flexWrap: 'nowrap', justifyContent: 'center', alignItems: 'center', columnGap: '26px', rowGap: '0px', flex: 'none', transformOrigin: '50% 50%'});
    let curP = -1, spans = [];
    function build(pi) {
      capIn.innerHTML = ''; spans = [];
      css(capIn, {flexWrap: 'nowrap', width: 'auto', transform: 'none'});
      const ph = PH[pi];
      for (let k = ph.a; k <= ph.b; k++) {
        const w = WD[k];
        const s = el('span', 'cw stroke', capIn);
        if (w.st === 'em') { s.textContent = w.w.replace(/[,]$/, ''); css(s, {font: 'italic 400 124px Serif', color: C.lime, WebkitTextStroke: '13px ' + C.ink, lineHeight: '1.02', letterSpacing: '-.01em', textShadow: `0 8px 0 ${C.ink}`}); }
        else if (w.st === 'x') { s.textContent = w.w; css(s, {font: '400 92px Anton', color: '#fff', background: C.coral, border: '7px solid ' + C.ink, borderRadius: '18px', padding: '2px 18px 6px', lineHeight: '1.1', boxShadow: `8px 8px 0 ${C.ink}`}); }
        else { s.textContent = w.w.toUpperCase().replace(/[,]$/, ''); css(s, {font: '400 104px Anton', color: C.cream, WebkitTextStroke: '15px ' + C.ink, lineHeight: '1.08', letterSpacing: '.01em', textShadow: `0 9px 0 ${C.ink}`}); }
        if (w.st === 'em') s.style.padding = '0 .14em';
        spans.push({s, w});
      }
      const wNat = capIn.scrollWidth;
      if (wNat > 940) {
        const sc = 940 / wNat;
        if (sc >= 0.7) capIn.style.transform = `scale(${sc})`;
        else css(capIn, {flexWrap: 'wrap', width: '940px'});
      }
    }
    const capY = t => (t >= S.code[0] && t < S.code[1]) ? SPLIT : 1480;
    scene([2.2, T.tEnd + .02], r, t => {
      let pi = -1; PH.forEach((p, k) => { if (t >= p.s && t < p.e) pi = k; });
      if (pi < 0) { capBox.style.opacity = 0; return; }
      if (pi !== curP) { build(pi); curP = pi; }
      capBox.style.opacity = 1;
      const y = capY(t);
      capBox.style.top = (y - 150) + 'px';
      let last = -1; spans.forEach((o, k) => { if (t >= o.w.s - .02) last = k; });
      spans.forEach((o, k) => {
        const dt = t - (o.w.s - .03);
        if (dt < 0) { o.s.style.opacity = 0; return; }
        o.s.style.opacity = 1;
        const p = spring(dt, 3, 10);
        let rot = 0, tx = 0;
        if (o.w.st === 'x') { const R = rng(Math.floor(t * 30) + k); rot = -5 + (R() - .5) * 8; tx = (R() - .5) * 10; }
        o.s.style.transform = `translate(${tx}px,${(1 - p) * 26}px) scale(${.55 + .45 * p}) rotate(${rot}deg)`;
        if (o.w.st === '') o.s.style.color = (k === last) ? C.lime : C.cream;
      });
    });
  }
  // ---------- END CARD
  {
    const r = el('div', 'full'); r.style.background = 'radial-gradient(110% 70% at 50% 40%, #2B5040 0%, #1F3A2F 45%, #10221A 100%)';
    const grid = el('div', 'full', r); css(grid, {backgroundImage: 'radial-gradient(circle, rgba(244,239,227,.07) 2px, transparent 2.6px)', backgroundSize: '36px 36px'});
    const lab = box(r, 0, 300, 1080, 50, {textAlign: 'center', font: '800 30px Inter', letterSpacing: '.24em', color: C.lime}); lab.textContent = 'WANT THIS EDIT?';
    const cm = box(r, 0, 360, 1080, 170, {textAlign: 'center', font: 'italic 400 160px Serif', color: C.cream, lineHeight: '170px'}); cm.textContent = 'Comment';
    const ew = box(r, 0, 520, 1080, 400, {display: 'flex', justifyContent: 'center', alignItems: 'flex-end'});
    const el4 = KEY.split('').map(ch => { const s = el('span', 'anton stroke', ew, ch); css(s, {display: 'inline-block', fontSize: '380px', color: C.lime, WebkitTextStroke: '12px ' + C.ink, textShadow: `14px 14px 0 ${C.ink}`, margin: '0 4px', transformOrigin: '50% 90%'}); return s; });
    const cb = box(r, 120, 1000, 840, 116, {background: '#fff', borderRadius: '60px', display: 'flex', alignItems: 'center', gap: '22px', padding: '0 20px 0 18px', boxSizing: 'border-box', boxShadow: '0 22px 60px rgba(0,0,0,.4)'});
    cb.innerHTML = `<div style="width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,#D8FF3E,#9FD3FF)"></div><div id=ecTxt style="font:500 36px Inter;color:#8a8f8b">Add a comment…</div><div id=ecPost style="margin-left:auto;font:800 32px Inter;color:#B9BDB8;padding:16px 26px;border-radius:40px">Post</div>`;
    const line = box(r, 90, 1176, 900, 130, {textAlign: 'center', font: '700 46px Inter', lineHeight: '60px', color: 'rgba(244,239,227,.92)'});
    line.innerHTML = `I'll DM you the same code<br>that edited this video.`;
    const stats = box(r, 0, 1350, 1080, 110, {display: 'flex', justifyContent: 'center', alignItems: 'baseline', gap: '28px', font: '400 92px Anton', color: C.cream});
    stats.innerHTML = `<span><span id=stN style="color:#D8FF3E">0</span> EDITS</span><span style="color:#6F9C84">·</span><span><span style="color:#D8FF3E">0</span> EDITORS</span>`;
    scene([T.tEnd - .01, T.dur + 1], r, t => {
      const E = T.end, dt = t - E.in;
      r.style.transform = `translateY(${1920 * (1 - eo(dt / .24))}px)`;
      lab.style.opacity = P(t, E.in + .18, E.in + .3);
      const cp = spring(t - (E.in + .12), 2.2, 8); cm.style.transform = `translateY(${(1 - cp) * 60}px)`; cm.style.opacity = clamp((t - E.in - .12) / .08);
      el4.forEach((s, k) => { const t0 = E.stamp + k * .07, p = eo(P(t, t0, t0 + .12)); s.style.opacity = t >= t0 ? 1 : 0; s.style.transform = `scale(${1.9 - .9 * p})`; });
      const bp = spring(t - E.bar, 2.3, 8.5); cb.style.opacity = t >= E.bar ? 1 : 0; cb.style.transform = `translateY(${(1 - bp) * 50}px) scale(${.9 + .1 * bp})`;
      const txt = document.getElementById('ecTxt'), post = document.getElementById('ecPost');
      if (t < E.typeA) { txt.textContent = 'Add a comment…'; txt.style.cssText = 'font:500 36px Inter;color:#8a8f8b'; }
      else { const n = Math.ceil(KEY.length * P(t, E.typeA, E.typeB)); txt.textContent = KEY.slice(0, Math.max(1, n)) + (t < E.post ? '|' : ''); txt.style.cssText = 'font:900 44px Inter;color:#0D1712;letter-spacing:.04em'; }
      const live = t >= E.typeB; post.style.background = live ? C.lime : 'transparent'; post.style.color = live ? C.ink : '#B9BDB8';
      post.style.transform = `scale(${t >= E.post && t < E.post + .08 ? .92 : 1})`;
      const lp = eo(P(t, E.line, E.line + .25)); line.style.opacity = lp; line.style.transform = `translateY(${(1 - lp) * 30}px)`;
      const sp = eo(P(t, E.stats, E.stats + .25)); stats.style.opacity = sp; stats.style.transform = `translateY(${(1 - sp) * 30}px)`;
      document.getElementById('stN').textContent = Math.round(T.nEdits * eo(P(t, E.stats, E.stats + .6)));
    });
  }
}

if (LAYER === 'back') buildBack(); else buildFront();

window.renderAt = function (t) {
  let any = false;
  for (const s of SCN) {
    const on = t >= s.range[0] && t < s.range[1];
    s.root.style.display = on ? 'block' : 'none';
    if (on) { s.render(t); any = true; }
  }
  return any;
};
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; })))).then(() => true);
if (Q.get('t')) window.ready.then(() => window.renderAt(parseFloat(Q.get('t'))));
</script></body></html>
